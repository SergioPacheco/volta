name: Deploy YouCity to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Build static site
        env:
          SEO_SITE_URL: ${{ steps.pages.outputs.origin }}
          SEO_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: node scripts/build-static.js

      - name: Validate generated site
        env:
          SEO_SITE_URL: ${{ steps.pages.outputs.origin }}
          SEO_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: node scripts/seo-check.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
